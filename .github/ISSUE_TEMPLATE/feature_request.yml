name: ✨ Feature Request
description: Suggest a new feature or enhancement to the launcher
title: "[FEATURE] "
labels: [enhancement, needs-review]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        # Feature Request

        Have an idea to improve the launcher? We'd love to hear it!

        **Before requesting:** Please check if a similar feature has been requested in [Discussions](https://github.com/malys/EVLauncher/discussions).

  - type: checkboxes
    id: checks
    attributes:
      label: "Pre-submission checks"
      description: "Ensure you've done these before submitting"
      options:
        - label: I've checked existing issues/discussions and found no duplicate
          required: true
        - label: This feature is for the launcher (not vehicle control — that's EVProfile/EVTasker)
          required: true
        - label: I understand this project is not affiliated with SAIC/MG Motor
          required: false

  - type: input
    id: title
    attributes:
      label: "Feature Title"
      description: "Clear, concise name for the feature"
      placeholder: "Add customizable app grid layout (3x3, 4x4, 5x5)"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "Problem or Use Case"
      description: |
        What problem does this solve? Why is it needed?
        - Current limitation
        - User need
        - How this improves the launcher
      placeholder: |
        Users have different numbers of favorite apps (5–20+).
        Current fixed 4x4 grid wastes space for users with few apps.
        Customizable grid would let drivers optimize their layout.
      rows: 5
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      description: |
        How should this feature work?
        - UI flow
        - Settings storage
        - Display considerations
      placeholder: |
        1. Add "Launcher Settings" screen with grid size picker (3x3, 4x4, 5x5)
        2. Store in SharedPreferences (persist across restarts)
        3. Adjust app shortcut sizes accordingly for 12.8\" display
      rows: 6
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternative Approaches"
      description: "Have you considered other ways to solve this?"
      placeholder: |
        - Alternative 1: Resizable shortcuts (drag corners)
        - Pro: maximum flexibility
        - Con: complex touch handling while driving
      rows: 4

  - type: dropdown
    id: complexity
    attributes:
      label: "Estimated Complexity"
      description: "How much work is this?"
      options:
        - "Small (< 1 day)"
        - "Medium (1–3 days)"
        - "Large (1–2 weeks)"
        - "Unknown"
    validations:
      required: true

  - type: checkboxes
    id: vehicle_impact
    attributes:
      label: "Vehicle Impact"
      description: "Does this feature affect vehicle systems?"
      options:
        - label: "No — launcher UI only"
        - label: "Yes — affects app launch, vehicle access"
        - label: "Unknown — unclear"
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance Criteria"
      description: "How will we know this feature is done?"
      placeholder: |
        - [ ] Grid size picker UI added to settings
        - [ ] Layout changes persist across app restarts
        - [ ] All grid sizes (3x3, 4x4, 5x5) render correctly on 12.8\" display
        - [ ] Text remains readable at all zoom levels
        - [ ] Touch targets remain >= 48dp for safe driving
      rows: 5

  - type: checkboxes
    id: consent
    attributes:
      label: "Consent"
      options:
        - label: I understand this project is not affiliated with SAIC/MG Motor and carries no warranty (see DISCLAIMER.md)
          required: true
