name: 🐛 Bug Report
description: Report a bug or issue you've encountered
title: "[BUG] "
labels: [bug, needs-review]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        # Bug Report

        Thank you for helping improve this launcher! Please provide as much detail as possible.

        **⚠️ UI/UX:** If this bug affects launcher display or touch responsiveness on the 12.8" infotainment screen, it impacts all drivers.

  - type: checkboxes
    id: checks
    attributes:
      label: "Pre-submission checks"
      description: "Ensure you've done these before submitting"
      options:
        - label: I've searched existing issues and found no duplicate
          required: true
        - label: I'm using the latest version
          required: true
        - label: I've tested this on the actual vehicle (or emulator)
          required: false
        - label: This bug affects display rendering or touch input
          required: false

  - type: input
    id: title
    attributes:
      label: "Bug Summary"
      description: "One-line summary of the bug"
      placeholder: "App shortcuts overflow off-screen on 12.8\" display"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: |
        Detailed description of the bug. Include:
        - What you expected to happen
        - What actually happened
        - Why this is a problem
      placeholder: |
        Expected: All app shortcuts visible on home screen
        Actual: Bottom row of shortcuts extends beyond screen edge
        Impact: Users cannot access last few apps; poor user experience on vehicle display
      rows: 6
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "Exact steps to reproduce the bug"
      placeholder: |
        1. Open EVLauncher
        2. Add 16+ apps to favorites
        3. Observe home screen layout
        4. Try to tap bottom-right shortcut
      rows: 5
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "Environment"
      description: "Device and software details"
      placeholder: |
        - Vehicle: MG4 EV
        - Firmware: SWI133
        - Android Automotive: v9
        - App Version: 1.0.0
        - Display: 12.8\" infotainment
      rows: 4
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Logs or Screenshots"
      description: |
        Attach:
        - Screenshot showing the issue
        - Logcat output (from ADB: `adb logcat | grep -i launcher`)
        - Any UI layout errors or warnings
      placeholder: "Paste logcat or description of visual issue here"
      rows: 8

  - type: dropdown
    id: severity
    attributes:
      label: "Severity"
      description: "How critical is this bug?"
      options:
        - "Critical (launcher unusable / display broken)"
        - "High (feature broken / major UI issue)"
        - "Medium (workaround available / minor UI glitch)"
        - "Low (cosmetic / very minor)"
    validations:
      required: true

  - type: dropdown
    id: display_impact
    attributes:
      label: "Display Impact"
      description: "Does this affect the infotainment display?"
      options:
        - "No — internal logic only"
        - "Yes — layout / rendering affected"
        - "Yes — touch input / responsiveness affected"
        - "Unknown — unclear impact"
    validations:
      required: true

  - type: checkboxes
    id: consent
    attributes:
      label: "Consent"
      options:
        - label: I understand this project is not affiliated with SAIC/MG Motor and carries no warranty (see DISCLAIMER.md)
          required: true
