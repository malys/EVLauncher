name: 🔐 Security Vulnerability
description: Report a security vulnerability (confidential)
title: "[SECURITY] "
labels: [security, confidential]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        # Security Vulnerability Report

        **⚠️ CONFIDENTIAL:** Do not disclose vulnerability details publicly.

        Please report security issues via private GitHub Security Advisory instead:
        1. Click "Report a vulnerability" at `/security/advisories/new`
        2. Or email: [maintainer security contact]
        3. Do **not** post details in public issues

        This template is for urgent in-scope vulnerabilities only.

  - type: checkboxes
    id: checks
    attributes:
      label: "Security Classification"
      description: "Select the vulnerability type"
      options:
        - label: "Prompt injection / malicious input not validated"
        - label: "Launcher crash / DoS (app relaunch loop)"
        - label: "App shortcut hijacking (wrong app launched)"
        - label: "Intent filter abuse (redirect to malicious app)"
        - label: "Permission escalation (elevation of privilege)"
        - label: "Code execution vulnerability"
        - label: "Information disclosure (leaks installed apps / system info)"
        - label: "Default launcher bypass"
        - label: "Other security issue affecting launcher users"
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: "Vulnerability Title"
      description: "Concise title (do not include exploit details)"
      placeholder: "Launcher crashes on malformed app shortcut"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Vulnerability Description"
      description: |
        High-level description (no exploit steps or proof-of-concept):
        - What is vulnerable
        - Why it matters
        - Impact on driver and vehicle
      placeholder: |
        A malformed app shortcut can crash the launcher, forcing recovery mode.
        An attacker could send a malicious shortcut via intent.
        Impact: Launcher becomes unusable until reboot; driver stuck without app access.
      rows: 6
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: "Severity (CVSS)"
      description: "CVSS v3.1 rating"
      options:
        - "Critical (9.0–10.0) — Launcher unusable / driver safety risk"
        - "High (7.0–8.9) — Significant functionality loss"
        - "Medium (4.0–6.9) — Moderate impact"
        - "Low (0.1–3.9) — Minor issue"
    validations:
      required: true

  - type: input
    id: affected
    attributes:
      label: "Affected Versions"
      description: "Which versions are affected?"
      placeholder: "EVLauncher < 1.2.0 (all builds)"
    validations:
      required: true

  - type: textarea
    id: remediation
    attributes:
      label: "Suggested Remediation"
      description: "How should this be fixed?"
      placeholder: |
        1. Validate app shortcut intent before launching
        2. Catch crashes and recover gracefully
        3. Implement input sanitization for package names
      rows: 5

  - type: checkboxes
    id: consent
    attributes:
      label: "Consent"
      options:
        - label: I understand this vulnerability will be handled according to the security policy
          required: true
        - label: I consent to coordinated disclosure and a reasonable embargo period
          required: true
