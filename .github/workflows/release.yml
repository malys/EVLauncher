name: Release

# Tag push only — publishing the APK that becomes the car's home screen is a human decision.
#
# Signed with the SAME platform key as the rest of the MG4 suite. The launcher needs no
# privileged permission of its own; the shared key is what makes the suite one installable
# set, and it is what an unstable build's OTA signature check compares against.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and publish APK
    runs-on: ubuntu-latest
    env:
      MG4_KEYSTORE_BASE64: ${{ secrets.MG4_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode platform keystore
        if: ${{ env.MG4_KEYSTORE_BASE64 != '' }}
        run: |
          # Tolerate newlines/spaces in the secret; printf avoids a stray trailing newline.
          printf '%s' "$MG4_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/platform.keystore"
          # A PKCS12/JKS keystore starts with 0x30 (DER SEQUENCE); anything else is corrupt.
          if [ "$(head -c1 "$RUNNER_TEMP/platform.keystore" | od -An -tx1 | tr -d ' ')" != "30" ]; then
            echo "::error::MG4_KEYSTORE_BASE64 is invalid. Recreate the secret with: base64 -w0 platform.keystore"
            exit 1
          fi
          echo "MG4_KEYSTORE=$RUNNER_TEMP/platform.keystore" >> "$GITHUB_ENV"

      - name: Run checks before publishing
        run: |
          chmod +x gradlew
          bash .github/security/check-permissions.sh
          ./gradlew testStableDebugUnitTest lintStableDebug --no-daemon

      - name: Build release APK
        env:
          MG4_KEYSTORE_PASSWORD: ${{ secrets.MG4_KEYSTORE_PASSWORD }}
          MG4_KEY_ALIAS: ${{ secrets.MG4_KEY_ALIAS }}
          MG4_KEY_PASSWORD: ${{ secrets.MG4_KEY_PASSWORD }}
        run: ./gradlew assembleStableRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          ver=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)"/\1/')
          find app/build/outputs/apk -name "app-stable-release.apk" -exec cp {} "dist/MG4SimpleLauncher-stable-${ver}.apk" \;
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: mg4simplelauncher-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: false
          files: dist/*.apk
          body: |
            ## MG4 Simple Launcher ${{ github.ref_name }}

            Manual, offline installation. This build embeds **no auto-updater** and
            contacts no server: the stable flavor has neither the updater code nor the
            INTERNET permission.

            ### Install
            Copy the APK to a USB stick, open the car's Files app and tap it. Then set it
            as the default home from Android settings.

            ### Note
            Signed with the MG4 suite platform key. If you are coming from a build signed
            with the old author key, uninstall the previous version first — Android refuses
            an in-place update across a key change.
